name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-latest:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      env:
        CARGO_SKIP_BUILD_SCRIPT: "1"
    - name: Build
      env:
        CARGO_SKIP_BUILD_SCRIPT: "1"
      run: cargo build --verbose
    - name: Run tests
      env:
        CARGO_SKIP_BUILD_SCRIPT: "1"
      run: cargo test --verbose

  
  build-macos-latest:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          CARGO_SKIP_BUILD_SCRIPT: "1"
        run: cargo build --verbose
      - name: Run tests
        env:
          CARGO_SKIP_BUILD_SCRIPT: "1"
        run: cargo test --verbose