[package]
name = "nova_renderer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nova_core = {  path = "../nova_core", version = "0.1.0" }
nova_math = {  path = "../nova_math", version = "0.1.0" }

anyhow = "1.0"
ash = "0.37.3"
ash-window = "0.12.0"
cgmath = "0.18.0"
log = "0.4.21"
raw-window-handle = "0.6.0"
thiserror = "1.0"
winit = "0.29.8"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.25" }
core-graphics-types = "0.1.3"
metal = { version = "0.27" }
objc = { version = "0.2" }
objc2 = "0.5.0"
