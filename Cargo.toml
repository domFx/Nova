[package]
name = "nova"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]
members = [
    "crates/nova_core",
    "crates/nova_macros",
    "crates/nova_math",
    "crates/nova_renderer",
    "crates/nova_runtime",
    "crates/nova_system"
]

[workspace.dependencies]
# Crates
nova_core = {  path = "crates/nova_core", version = "0.1.0" }
nova_macros = { path = "crates/nova_macros", version = "0.1.0" }
nova_math = {  path = "crates/nova_math", version = "0.1.0" }
nova_renderer = {  path = "crates/nova_renderer", version = "0.1.0" }
nova_runtime = {  path = "crates/nova_runtime", version = "0.1.0" }

# Other shared
anyhow = "1.0.97"
log = "0.4.27"
once_cell = "1.21.1"
pretty_env_logger = "0.5.0"
raw-window-handle = "0.6.2"
thiserror = "2.0.12"
winit = "0.30.9"

[dependencies]
anyhow.workspace = true
log.workspace = true
pretty_env_logger.workspace = true
nova_core.workspace = true
nova_math.workspace = true
nova_renderer.workspace = true
nova_runtime.workspace = true

[profile.dev]
debug = true