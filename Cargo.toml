[package]
name = "nova"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[workspace]
members = [
    "crates/nova_core",
    "crates/nova_math",
    "crates/nova_renderer",
    "crates/nova_system",
    "crates/nova_window"
]

[workspace.dependencies]
# Crates
nova_core = {  path = "crates/nova_core", version = "0.1.0" }
nova_math = {  path = "crates/nova_math", version = "0.1.0" }
nova_renderer = {  path = "crates/nova_renderer", version = "0.1.0" }
nova_window = {  path = "crates/nova_window", version = "0.1.0" }

# Other shared
anyhow = "1.0"
log = "0.4.21"
once_cell = "1.19.0"
pretty_env_logger = "0.5.0"
raw-window-handle = "0.6.2"
thiserror = "2.0.3"
winit = "0.30.5"

[dependencies]
anyhow.workspace = true
log.workspace = true
pretty_env_logger.workspace = true
nova_core.workspace = true
nova_math.workspace = true
nova_renderer.workspace = true
nova_window.workspace = true

[features]
ci = []